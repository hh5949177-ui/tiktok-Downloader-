<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>WHYA TikTok API</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #090909; color: #f5f5f5;
      font: 15px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 480px); padding: 30px; border: 1px solid #292929;
      border-radius: 18px; background: #111;
    }
    .status {
      display: inline-block; padding: 6px 10px; border-radius: 7px;
      background: #153322; color: #83e5a6; font-size: 12px;
    }
    h1 { margin: 18px 0 8px; letter-spacing: -.04em; }
    p { color: #aaa; }
    code { color: #ddd; overflow-wrap: anywhere; }
    li { margin: 8px 0; color: #ccc; }
  </style>
</head>
<body>
  <main>
    <span class="status">SERVICE DEPLOYED</span>
    <h1>WHYA TikTok API</h1>
    <p>Endpoint API sudah dipasang. Pemrosesan media belum aktif sampai provider yang kompatibel dikonfigurasi.</p>
    <strong>Endpoints</strong>
    <ul>
      <li><code>POST /api/tiktok/info</code></li>
      <li><code>POST /api/tiktok/video</code></li>
      <li><code>POST /api/tiktok/audio</code></li>
      <li><code>POST /api/tiktok</code></li>
    </ul>
  </main>
</body>
</html>
