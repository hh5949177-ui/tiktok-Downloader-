[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tiktok/*"
  to = "/.netlify/functions/tiktok/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/tiktok"
  to = "/.netlify/functions/tiktok"
  status = 200
  force = true
